<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Noble & Co · Vehicle Operations</title>
<meta name="theme-color" content="#08080b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Noble Ops">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<style>html,body{margin:0;height:100%;background:#08080b;color:#9a9aa3;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}.boot{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;box-sizing:border-box;text-align:center}.boot img{width:min(220px,60vw)}.spin{width:22px;height:22px;border:2px solid #333;border-top-color:#e0202f;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.btn{display:none;background:#e0202f;color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:700;font-size:15px}</style>
</head><body>
<div class="boot"><img src="logo.png" alt="Noble &amp; Co Auto Group"><div class="spin" id="spin"></div><div id="msg">Loading…</div><button class="btn" id="retry" onclick="location.reload()">Try again</button></div>
<script>
// This page never changes: it loads the app screen from the Apps Script deployment, so every update there shows
// up here too. The app runs on this address (not Google's), so there is no Google banner and sign-in sticks.
// The last good copy of the screen is kept on the phone, so the app opens instantly and still opens offline.
var EXEC = 'https://script.google.com/macros/s/AKfycbyUNUpeYo9SVfgs2Znd681YAM7jgk96vr_irvqXLWyxb4wXbXSdCvAZ-V6hhoAsliwmPA/exec';
(async function () {
var key = 'noble_page_cache', cached = '';
try { cached = localStorage.getItem(key) || ''; } catch (e) {}
function show(html) { try { document.body.innerHTML = ''; } catch (e) {} document.open(); document.write(html); document.close(); }
// wait for this shell to finish parsing, so the write replaces the page instead of landing inside it
await new Promise(function (r) { if (document.readyState === 'complete') r(); else window.addEventListener('load', r); });
// Cached copy first (instant); a fresh copy is fetched in the background for next time.
if (cached) {
  show(cached);
  try { var r0 = await fetch(EXEC + '?asset=page&v=' + Date.now()); if (r0.ok) { var h0 = await r0.text(); if (/<html/i.test(h0) && /nobleLogo/.test(h0)) localStorage.setItem(key, h0); } } catch (e) {}
  return;
}
try {
var ctl = new AbortController(), timer = setTimeout(function () { ctl.abort(); }, 20000);
var r = await fetch(EXEC + '?asset=page&v=' + Date.now(), { signal: ctl.signal });
clearTimeout(timer);
if (!r.ok) throw new Error('HTTP ' + r.status);
var html = await r.text();
if (!/<html/i.test(html) || !/nobleLogo/.test(html)) throw new Error('unexpected page');
try { localStorage.setItem(key, html); } catch (e) {}
show(html);
} catch (e) {
document.getElementById('spin').style.display = 'none';
document.getElementById('msg').textContent = 'Could not load the app (' + (e && e.message ? e.message : e) + '). Check your connection.';
document.getElementById('retry').style.display = 'inline-block';
}
})();
</script>
</body></html>
